name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  pester:
    name: Pester tests (PS 5.1 + 7)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 5
        shell: ${{ matrix.shell }}
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Pester tests
        shell: ${{ matrix.shell }}
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          $result = Invoke-Pester -Path ./Tests/FeedHelpers.Tests.ps1 -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
          if ($result.PassedCount -eq 0) { Write-Error 'No tests ran'; exit 1 }

  analyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Analyze
        shell: pwsh
        run: |
          # Empty catch blocks are intentional best-effort cleanup (Dispose/Stop); PSScriptRoot is re-derived on purpose when invoked via -File.
          $all = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,PSAvoidUsingEmptyCatchBlock,PSUseSingularNouns
          $all | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          $errors = @($all | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) { Write-Error "$($errors.Count) analyzer error(s)"; exit 1 }

  smoke:
    name: Smoke run (live feeds, no NVD)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke run
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'report'
          $state = Join-Path $env:RUNNER_TEMP 'state.json'
          & ./ThreatRaven.ps1 -ConfigPath ./Tests/smoke-config.json -OutputDir $out -StatePath $state -NonInteractive -NoOpenReport -QuietMode
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $csv = Get-ChildItem -LiteralPath $out -Filter *.csv | Select-Object -First 1
          if (-not $csv) { Write-Error 'No CSV report generated'; exit 1 }
          $html = Get-ChildItem -LiteralPath $out -Filter *.html | Select-Object -First 1
          if (-not $html) { Write-Error 'No HTML report generated'; exit 1 }
          $content = Get-Content -LiteralPath $html.FullName -Raw
          if ($content -notmatch 'id="tr-data"') { Write-Error 'Report is missing the embedded data block'; exit 1 }
          if ($content -match '\{\{[A-Z_]+\}\}') { Write-Error 'Report has unreplaced template tokens'; exit 1 }
          if (-not (Test-Path -LiteralPath $state)) { Write-Error 'State file was not written'; exit 1 }
          $health = Get-ChildItem -LiteralPath $out -Filter 'FeedHealth_*.json' | Select-Object -First 1
          if ($health) { Get-Content -LiteralPath $health.FullName -Raw | ConvertFrom-Json | Select-Object -ExpandProperty Summary | Format-List | Out-String | Write-Host }
